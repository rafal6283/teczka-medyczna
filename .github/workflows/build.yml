name: Zbuduj aplikację

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    # Jednorazowo generuje foldery android/ i ios/ (flutter create) i zapisuje je w repo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Czy brakuje platform?
        id: check
        run: |
          if [ -d android ] && [ -d ios ]; then echo "need=false" >> $GITHUB_OUTPUT; else echo "need=true" >> $GITHUB_OUTPUT; fi
      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.need == 'true'
        with:
          channel: stable
          cache: true
      - name: flutter create
        if: steps.check.outputs.need == 'true'
        run: |
          flutter --version
          flutter create --org pl.teczka --project-name teczka_zdrowia --platforms android,ios .
          rm -f test/widget_test.dart
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Wygenerowane platformy Android i iOS (flutter create)"
          git push

  android:
    needs: bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Zależności
        run: |
          flutter --version | head -1 | sed 's/^/::notice::/'
          set -o pipefail
          flutter pub get 2>&1 | tee build.log
      - name: Analiza kodu
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log
      - name: Testy parsera
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log
      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm64 --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} 2>&1 | tee build.log
          cp build/app/outputs/flutter-apk/app-release.apk teczka-zdrowia.apk
      - name: Zgłoś błędy
        if: failure()
        run: |
          bash .github/report.sh analyze.log test.log build.log
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: teczka-zdrowia.apk

  ios:
    needs: bootstrap
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build iOS (bez podpisu)
        run: |
          set -o pipefail
          flutter pub get
          flutter build ios --release --no-codesign --verbose --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} 2>&1 | tee build.log
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr teczka-zdrowia.ipa Payload
      - name: Zgłoś błędy
        if: failure()
        run: |
          grep -E "error:|\*\* BUILD FAILED|Signing|requires a development team|provisioning" build.log | grep -v "^\[" | head -40 > ios_err.log || true
          grep -E "error:|requires a development team|Signing for" build.log | head -40 >> ios_err.log || true
          bash .github/report.sh ios_err.log
      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: teczka-zdrowia.ipa

  smoke:
    # Uruchamia zbudowaną wersję release na emulatorze Androida i sprawdza start aplikacji.
    needs: bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build APK x86_64 (dla emulatora)
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-x64
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test na emulatorze
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/smoke.sh build/app/outputs/flutter-apk/app-release.apk > smoke.log 2>&1; echo $? > smoke.rc; true
      - name: Wynik testu na emulatorze
        if: always()
        run: |
          echo "rc=$(cat smoke.rc 2>/dev/null)"
          cat smoke.log 2>/dev/null | tail -150
          grep -h "::" smoke.log 2>/dev/null | head -10 || true
          { echo "SMOKE rc=$(cat smoke.rc 2>/dev/null)"; tail -60 smoke.log 2>/dev/null; } | sed 's/%/%25/g' | cut -c1-300 > s.txt
          echo "::notice::$(head -60 s.txt | sed ':a;N;$!ba;s/\n/%0A/g')"
          test -f logcat_err.txt && echo "::notice::LOGCAT%0A$(tail -40 logcat_err.txt | sed 's/%/%25/g' | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')"
          [ "$(cat smoke.rc 2>/dev/null)" = "0" ]

  release:
    needs: [android, ios, smoke]
    if: always() && needs.android.result == 'success' && needs.smoke.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Opublikuj w Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Teczka Zdrowia 1.0.${{ github.run_number }}
          body: |
            **Android:** pobierz `teczka-zdrowia.apk` na telefonie i zainstaluj (aktualizuje poprzednią wersję, dane zostają).
            **iPhone:** pobierz `teczka-zdrowia.ipa` na komputer i zainstaluj przez Sideloadly lub AltStore swoim Apple ID (odnawianie co 7 dni).
          files: out/**/*
          fail_on_unmatched_files: false
          make_latest: true
