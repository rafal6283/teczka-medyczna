name: teczka_zdrowia
description: Teczka Zdrowia - prywatne archiwum wyników badań z analizą trendów.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0
  file_picker: ^10.1.0
  image_picker: ^1.1.2
  syncfusion_flutter_pdf: '>=27.1.0 <40.0.0'
  pdfx: ^2.9.0
  google_mlkit_text_recognition: ^0.15.0
  local_auth: ^2.3.0
  archive: '>=3.6.1 <5.0.0'
  image: ^4.2.0
  cunning_document_scanner: ^1.2.3
  open_filex: ^4.6.0
  shared_preferences: ^2.3.3
  crypto: ^3.0.6
  koofr_backup_ui:
    git:
      url: https://github.com/rafal6283/nocny-licznik
      path: packages/koofr_backup_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
